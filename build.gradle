plugins {
    id 'java'
    id "xyz.jpenilla.run-paper" version "3.0.2"
}

group = 'com.jeyers'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigot-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT"
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}

def createVersionJar(String versionSuffix, int javaVersion) {
    def sourceSetName = "java${javaVersion}"

    sourceSets {
        create(sourceSetName) {
            java.srcDirs = [file("src/main/java")]
            resources.srcDirs = [file("src/main/resources")]
        }
    }

    configurations.named("${sourceSetName}CompileOnly") {
        extendsFrom configurations.compileOnly
    }

    tasks.named("compile${sourceSetName.capitalize()}Java", JavaCompile) {
        options.encoding = 'UTF-8'
        options.release.set(javaVersion)
    }

    return tasks.register("jar${versionSuffix}", Jar) {
        dependsOn tasks.named("processResources")
        from sourceSets.named(sourceSetName).get().output

        archiveBaseName.set("LobbyNoData")
        archiveVersion.set("1.0-${versionSuffix}")
        destinationDirectory.set(layout.buildDirectory.dir("out-jars"))
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        doLast {
            println("✅ Built ${archiveFile.get().asFile.name} (Target: Java ${javaVersion})")
        }
    }
}

def jar17 = createVersionJar("Java17", 17)
def jar21 = createVersionJar("Java21", 21)
def jar25 = createVersionJar("Java25", 25)

tasks.build {
    dependsOn(jar17, jar21, jar25)
}

tasks.runServer {
    minecraftVersion("26.1.2")
}